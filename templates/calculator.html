<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Child Support Calculator</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/calculator.css') }}"/>
</head>
<body>

<header>CloudAct &nbsp;·&nbsp; <span>Child Support Calculator</span></header>

<div class="container">

  <!-- Province -->
  <div class="card">
    <h2>Province</h2>
    <div class="row">
      <div class="field">
        <label>Province for calculation</label>
        <select id="province">
          <option value="ON">Ontario</option>
          <option value="BC">British Columbia</option>
          <option value="AB">Alberta</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Party 1 -->
  <div class="card">
    <h2>Party 1</h2>
    <div class="row">
      <div class="field">
        <label>Name (optional)</label>
        <input type="text" id="p1-name" placeholder="e.g. Alex"/>
      </div>
      <div class="field">
        <label>Guideline Income (annual, $)</label>
        <input type="number" id="p1-income" placeholder="e.g. 85000" min="0" step="1"/>
      </div>
    </div>
  </div>

  <!-- Party 2 -->
  <div class="card">
    <h2>Party 2</h2>
    <div class="row">
      <div class="field">
        <label>Name (optional)</label>
        <input type="text" id="p2-name" placeholder="e.g. Jordan"/>
      </div>
      <div class="field">
        <label>Guideline Income (annual, $)</label>
        <input type="number" id="p2-income" placeholder="e.g. 55000" min="0" step="1"/>
      </div>
    </div>
  </div>

  <!-- Children -->
  <div class="card">
    <h2>Children</h2>
    <div id="children-list"></div>
    <button id="add-child-btn" onclick="addChild()">+ Add Child</button>
  </div>

  <!-- Calculate -->
  <button id="calc-btn" onclick="calculate()">Calculate Child Support</button>
  <div id="error-msg"></div>

  <!-- Results -->
  <div class="card" id="result-card">
    <h2>Result</h2>
    <div id="scenario-tag" class="tag"></div>
    <div class="result-grid" id="result-grid"></div>
    <div id="verdict" class="verdict"></div>
  </div>

</div>

<script src="{{ url_for('static', filename='js/calculator.js') }}"></script>
</body>
</html>
